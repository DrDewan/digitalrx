name: Apply Digital Rx demo mode

on:
  push:
    branches: [main]
    paths:
      - '.github/demo-mode.patch'

permissions:
  contents: write

jobs:
  apply-demo-mode:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install demo adapter
        shell: bash
        run: |
          awk '
            /^@@ -0,0 +1,448 @@/ { capture=1; next }
            /^+diff -ruN / { capture=0 }
            capture { sub(/^+/, ""); print }
          ' .github/demo-mode.patch > src/lib/demo.ts
          test -s src/lib/demo.ts

      - name: Wire demo adapter into Supabase wrappers
        shell: python
        run: |
          from pathlib import Path

          p = Path("src/lib/supabase/client.ts")
          s = p.read_text()
          s = s.replace(
              'import type { Database } from "@/lib/db/types";',
              'import type { Database } from "@/lib/db/types";\nimport { createDemoClient, DEMO_MODE } from "@/lib/demo";',
          )
          s = s.replace(
              'export function createClient() {\n  return createBrowserClient<Database>(',
              'export function createClient() {\n  if (DEMO_MODE) return createDemoClient() as any;\n\n  return createBrowserClient<Database>(',
          )
          p.write_text(s)

          p = Path("src/lib/supabase/server.ts")
          s = p.read_text()
          s = s.replace(
              'import type { Database } from "@/lib/db/types";',
              'import type { Database } from "@/lib/db/types";\nimport { createDemoClient, DEMO_MODE } from "@/lib/demo";',
          )
          s = s.replace(
              'export async function createClient() {\n  const cookieStore = await cookies();',
              'export async function createClient() {\n  if (DEMO_MODE) return createDemoClient() as any;\n\n  const cookieStore = await cookies();',
          )
          p.write_text(s)

          p = Path("src/lib/supabase/middleware.ts")
          s = p.read_text()
          s = s.replace(
              'export async function updateSession(request: NextRequest) {\n  let response = NextResponse.next({ request });',
              '''export async function updateSession(request: NextRequest) {\n  if (\n    process.env.NEXT_PUBLIC_DEMO_MODE === "true" ||\n    !process.env.NEXT_PUBLIC_SUPABASE_URL ||\n    !process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY\n  ) {\n    return NextResponse.next({ request });\n  }\n\n  let response = NextResponse.next({ request });''',
          )
          p.write_text(s)

      - name: Validate and clean bootstrap files
        run: |
          grep -q 'export function createDemoClient' src/lib/demo.ts
          grep -q 'if (DEMO_MODE)' src/lib/supabase/client.ts
          grep -q 'if (DEMO_MODE)' src/lib/supabase/server.ts
          git diff --check
          rm -f .github/demo-mode.patch .github/workflows/apply-demo-mode.yml

      - name: Commit demo mode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add frontend demo mode"
          git push origin HEAD:main
