name: Reflow prescription workspace

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reflow-prescription-ui.yml'

permissions:
  contents: write

jobs:
  reflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UI reflow
        run: |
          python - <<'PY'
          from pathlib import Path

          # Collapsible desktop navigation rail.
          p = Path('src/components/app-shell.tsx')
          s = p.read_text()
          s = s.replace(
              '"use client";\n\nimport Link from "next/link";',
              '"use client";\n\nimport { useEffect, useState } from "react";\nimport Link from "next/link";'
          )
          s = s.replace(
              '  const pathname = usePathname();\n  const t = (key: Parameters<typeof translate>[1]) => translate(language, key);',
              '''  const pathname = usePathname();\n  const [navCollapsed, setNavCollapsed] = useState(false);\n  const t = (key: Parameters<typeof translate>[1]) => translate(language, key);\n\n  useEffect(() => {\n    setNavCollapsed(window.localStorage.getItem("digital-rx:nav-collapsed") === "1");\n  }, []);\n\n  const toggleNav = () => {\n    setNavCollapsed((current) => {\n      const next = !current;\n      window.localStorage.setItem("digital-rx:nav-collapsed", next ? "1" : "0");\n      return next;\n    });\n  };'''
          )
          old_nav = '''        <nav\n          aria-label="Sections"\n          className="no-print sticky top-14 z-20 flex shrink-0 gap-1 overflow-x-auto border-b border-slate-200 bg-white px-2 py-1.5\n                     lg:sticky lg:top-14 lg:h-[calc(100dvh-3.5rem)] lg:w-52 lg:flex-col lg:overflow-y-auto lg:border-r lg:border-b-0 lg:px-2 lg:py-3"\n        >\n          {NAV.map(({ href, labelKey, Icon }) => {'''
          new_nav = '''        <nav\n          aria-label="Sections"\n          className={`no-print sticky top-14 z-20 flex shrink-0 gap-1 overflow-x-auto border-b border-slate-200 bg-white px-2 py-1.5 transition-[width] duration-200\n                     lg:sticky lg:top-14 lg:h-[calc(100dvh-3.5rem)] lg:flex-col lg:overflow-y-auto lg:border-r lg:border-b-0 lg:px-2 lg:py-3 ${\n                       navCollapsed ? "lg:w-16" : "lg:w-52"\n                     }`}\n        >\n          <button\n            type="button"\n            onClick={toggleNav}\n            className="mb-1 hidden h-9 items-center justify-center rounded-md border border-slate-200 text-sm font-semibold text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 lg:flex"\n            aria-label={navCollapsed ? "Expand navigation" : "Collapse navigation"}\n            title={navCollapsed ? "Expand navigation" : "Collapse navigation"}\n          >\n            {navCollapsed ? "›" : "‹"}\n          </button>\n\n          {NAV.map(({ href, labelKey, Icon }) => {'''
          if old_nav not in s:
              raise SystemExit('app-shell nav block not found')
          s = s.replace(old_nav, new_nav)
          s = s.replace(
              '                <span>{t(labelKey)}</span>',
              '                <span className={navCollapsed ? "lg:hidden" : ""}>{t(labelKey)}</span>'
          )
          p.write_text(s)

          # Three-zone prescription workflow.
          p = Path('src/components/rx/workspace.tsx')
          s = p.read_text()
          old_body = '''      {/* Body */}\n      <div className="grid flex-1 gap-3 p-3 xl:grid-cols-2">\n        <div className="space-y-3">\n          <ComplaintsPanel language={language} />\n          <HistoryPanel language={language} />\n          <ExaminationPanel language={language} />\n          <InvestigationsPanel language={language} />\n        </div>\n\n        <div className="space-y-3">\n          <MedicinesPanel language={language} />\n          <DiagnosisPanel language={language} />\n          <AdvicePanel language={language} />\n          <PlanNotesPanel language={language} />\n          <OverlayPanel language={language} />\n        </div>\n      </div>'''
          new_body = '''      {/* Clinical workflow: pad | consultation | examination */}\n      <div className="grid flex-1 gap-3 p-3 xl:grid-cols-3 xl:items-start">\n        <div className="space-y-3 xl:order-1">\n          <OverlayPanel language={language} />\n        </div>\n\n        <div className="space-y-3 xl:order-2">\n          <ComplaintsPanel language={language} />\n          <HistoryPanel language={language} />\n          <DiagnosisPanel language={language} />\n          <MedicinesPanel language={language} />\n          <AdvicePanel language={language} />\n          <PlanNotesPanel language={language} />\n        </div>\n\n        <div className="space-y-3 xl:order-3">\n          <ExaminationPanel language={language} />\n          <InvestigationsPanel language={language} />\n        </div>\n      </div>'''
          if old_body not in s:
              raise SystemExit('workspace body block not found')
          s = s.replace(old_body, new_body)
          p.write_text(s)

          # Present medication entry as the Treatment step in the new flow.
          p = Path('src/components/rx/medicines-panel.tsx')
          s = p.read_text()
          old = '      title={t("medicines")}\n'
          new = '      title={language === "bn" ? "চিকিৎসা" : "Treatment"}\n'
          if old not in s:
              raise SystemExit('medicines panel title not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/reflow-prescription-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reflow prescription workspace"
          git push origin main
