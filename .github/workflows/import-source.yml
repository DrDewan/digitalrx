name: Import Digital Rx source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-source.yml'
      - 'digital-rx.zip'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack uploaded Digital Rx source
        shell: bash
        run: |
          rm -rf /tmp/digitalrx-import
          mkdir -p /tmp/digitalrx-import
          unzip -q digital-rx.zip -d /tmp/digitalrx-import

          if [ -f /tmp/digitalrx-import/package.json ]; then
            SRC=/tmp/digitalrx-import
          else
            SRC=$(find /tmp/digitalrx-import -mindepth 1 -maxdepth 2 -type f -name package.json -print -quit | xargs -r dirname)
          fi

          test -n "$SRC"
          test -f "$SRC/package.json"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/import-source.yml' \
            "$SRC/" ./

          rm -rf .bootstrap
          rm -f digital-rx.zip

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import Digital Rx source"
          git push origin HEAD:main
