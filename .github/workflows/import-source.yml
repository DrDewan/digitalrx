name: Import Digital Rx source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/chunk_00'
      - '.bootstrap/b64_01_0'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and unpack source
        shell: bash
        run: |
          cat .bootstrap/chunk_00 > /tmp/source.tar.gz
          for p in 01 02 03; do
            cat .bootstrap/b64_${p}_* | base64 -d >> /tmp/source.tar.gz
          done
          cat .bootstrap/chunk_{04..18} >> /tmp/source.tar.gz
          test "$(wc -c < /tmp/source.tar.gz)" -eq 73351
          tar -tzf /tmp/source.tar.gz >/dev/null
          tar -xzf /tmp/source.tar.gz -C .

      - name: Remove one-time bootstrap files
        run: rm -rf .bootstrap .github/workflows/import-source.yml

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import Digital Rx source"
          git push origin HEAD:main
